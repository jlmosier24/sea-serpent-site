<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stats | Spotswood Sea Serpents</title>
<meta name="description" content="Swimmer results and season progression for the Spotswood Sea Serpents summer swim team.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M4 30c4-6 8-6 12 0s8 6 12 0 8-6 12 0 8 6 12 0' stroke='%232F8F3E' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/site.js"></script>
<script src="/assets/meets.js"></script>
<style>
    /* Stats page only. Cards, tiles, and the meet results popup come from /assets/site.css. */
    .stats-stack { display: flex; flex-direction: column; gap: 22px; padding-bottom: 80px; }
    .stats-list { display: flex; flex-direction: column; gap: 22px; }
    .picker-label { display: block; margin: 0 0 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
    .swimmer-select { padding: 16px 18px; font-size: 18px; border-radius: 16px; }
    .loading, .empty { margin: 0; padding: 24px 0; color: var(--muted-on-page); text-align: center; }

    /* The swimmer's green header card, at full page width. */
    .swimmer-hero { border-radius: var(--radius-card); padding: 26px; }
    .swimmer-hero::before { width: 260px; height: 260px; right: -80px; top: -110px; }
    .swimmer-hero::after { width: 140px; height: 140px; right: 40px; top: -40px; }
    .swimmer-head { display: flex; align-items: center; gap: 16px; }
    .swimmer-avatar { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 60px; height: 60px; border-radius: 50%; background: var(--gold); color: var(--gold-ink); font-size: 20px; font-weight: 700; }
    .swimmer-head h2 { margin: 0; font-size: 30px; line-height: 1.15; }
    .swimmer-head p { margin: 4px 0 0; font-size: 16px; opacity: .9; }

    /* Badges (design/update-2/UPDATE.md, section 2): white tiles on the green
       card, New ones first. Wider screens show 10 and phones 6, until "Show all". */
    .badges-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-top: 22px; }
    .badges-head h3 { margin: 0; font-size: 20px; }
    .badges-count { font-size: 14px; font-weight: 600; }
    .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 12px; }
    .badge-grid:not(.expanded) > .badge-tile:nth-child(n+11) { display: none; }
    .badge-tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 16px 8px 12px; border: 1px solid #fff; border-radius: 20px; background: #fff; color: var(--ink); font: inherit; text-align: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.22); }
    .badge-tile:hover { background: var(--gold-tint); }
    .badge-new { position: absolute; top: 8px; right: 8px; padding: 2px 8px; border-radius: 10px; background: var(--gold); color: var(--gold-ink); font-size: 11px; font-weight: 700; }
    .badge-disc { position: relative; display: flex; align-items: center; justify-content: center; width: 60px; height: 60px; margin-bottom: 8px; border: 2px solid var(--gold); border-radius: 50%; background: var(--gold-tint); color: var(--gold-text); }
    .badge-disc svg { width: 30px; height: 30px; }
    .badge-pill { position: absolute; right: -6px; bottom: -4px; display: flex; align-items: center; justify-content: center; min-width: 26px; height: 22px; padding: 0 6px; border: 2px solid #fff; border-radius: 12px; background: var(--brand); color: #fff; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .badge-tile:hover .badge-pill { border-color: var(--gold-tint); }
    .badge-name { font-size: 15px; font-weight: 700; line-height: 1.2; }
    .badge-when { font-size: 13px; color: var(--muted); }
    .show-all { display: none; }
    .badge-area[data-more="all"] .show-all { display: flex; width: fit-content; margin: 14px auto 0; }

    /* The slim stat strip under the badges, or a friendly line when it's empty.
       Full-white text, and only a light wash behind it: faded text, or a
       stronger wash, falls under 4.5:1 at the card's lightest corner. */
    .stat-strip { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 16px 0 0; padding: 12px 6px 0; border-top: 1px solid rgba(255,255,255,.22); list-style: none; }
    .stat-strip li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
    .strip-value { font-family: var(--font-head); font-size: 22px; font-weight: 700; line-height: 1; }
    .strip-label { font-size: 14px; }
    .strip-label small { font-size: 12.5px; }
    .friendly-line { margin: 20px 0 0; padding: 16px 18px; border: 1px solid rgba(255,255,255,.24); border-radius: var(--radius-tile); background: rgba(255,255,255,.08); font-size: 16px; line-height: 1.45; }

    /* The badge dialog, a little narrower than the site's others (the mockup's 440px). */
    @media (min-width: 601px) { dialog.dialog.badge-dialog { width: min(440px, calc(100vw - 48px)); } }
    /* The close button sits in the corner, beside the disc rather than above it. */
    .badge-dialog .dialog-head { position: absolute; top: 0; right: 0; }
    .badge-dialog .dialog-body { padding-top: 30px; }
    .badge-big { text-align: center; }
    .badge-big .badge-disc { width: 96px; height: 96px; margin: 0 auto 10px; }
    .badge-big .badge-disc svg { width: 48px; height: 48px; }
    .badge-big .badge-pill { height: 26px; font-size: 14px; }
    .badge-big h2 { margin: 0 0 6px; font-size: 26px; }
    .badge-big p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.45; }
    .badge-earned { margin-top: 18px; padding: 14px 16px; border-radius: var(--radius-tile); }
    .earned-label { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
    .earned-value { margin: 0; font-size: 16px; font-weight: 600; }
    .earned-value + .earned-label { margin-top: 12px; }
    .badge-done { margin-top: 16px; padding: 14px; font-size: 17px; }

    /* One card per event */
    .event-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .event-head h3 { margin: 0; font-size: 21px; }
    .season-best { padding: 6px 14px; border-radius: var(--radius-round); background: var(--ok-tint); color: var(--ok-text); font-size: 14px; font-weight: 700; white-space: nowrap; }
    .chart-box { margin-bottom: 16px; padding: 10px 8px 6px; border-radius: 20px; }
    .chart-box svg { display: block; }
    .chart-note { margin: 0 12px 6px; text-align: right; font-size: 12.5px; color: var(--muted); }
    .chart-grid { stroke: var(--soft-border); stroke-dasharray: 3 5; }
    .chart-line { fill: none; stroke: var(--brand); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .chart-dot { fill: #fff; stroke: var(--brand); stroke-width: 3; }
    .chart-best { fill: var(--gold); stroke: #fff; stroke-width: 2.5; }
    .chart-best-halo { fill: var(--gold); opacity: .28; }
    /* An outline in the box's color keeps a time readable where the line runs behind it. */
    .chart-value { font-size: 14px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--soft); stroke-width: 4px; stroke-linejoin: round; }
    .chart-date { font-size: 12.5px; fill: var(--muted); }

    .swims { width: 100%; border-collapse: collapse; }
    .swims th { padding: 8px 10px; border-bottom: 1px solid var(--card-border); text-align: left; font-size: 14px; font-weight: 600; color: var(--muted); }
    .swims td { padding: 12px 10px; border-bottom: 1px solid var(--card-border); font-size: 16px; vertical-align: middle; }
    .swims tr:last-child td { border-bottom: 0; }
    .swims td:first-child { white-space: nowrap; }
    .swims .r { text-align: right; }
    .opponent-link { display: inline-flex; align-items: center; gap: 2px; padding: 0; border: 0; background: none; color: var(--brand); font-size: inherit; font-weight: 600; text-align: left; cursor: pointer; }
    /* A long one-word name breaks instead of pushing the table wider than a phone. */
    .swims td:nth-child(2) { overflow-wrap: anywhere; }
    .opponent-link:hover { text-decoration: underline; }
    .opponent-link svg { width: 16px; height: 16px; flex-shrink: 0; }
    /* Times and changes have fixed widths so they line up down the table. */
    .time-cell { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .time { display: inline-block; min-width: 4.6em; font-weight: 600; font-variant-numeric: tabular-nums; }
    .change { display: inline-block; min-width: 4.8em; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .change.faster { color: var(--brand); }
    .change.slower { color: var(--muted); font-weight: 500; }
    .pb-tag { padding: 1px 7px; border: 1px solid var(--gold-border); border-radius: 10px; background: var(--gold-tint); color: var(--gold-text); font-size: 11px; font-weight: 700; }
    .swim-status { color: var(--muted); font-weight: 600; }
    .place { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; border-radius: 50%; font-weight: 600; }
    .place.podium { background: var(--gold); color: var(--gold-ink); font-weight: 700; }

    @media (max-width: 600px) {
        .swimmer-hero { padding: 20px 16px; }
        .swimmer-head h2 { font-size: 26px; }
        /* Two tiles across, even at 340px. */
        .badge-grid { grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 10px; }
        .badge-grid:not(.expanded) > .badge-tile:nth-child(n+7) { display: none; }
        .badge-area[data-more] .show-all { display: flex; width: fit-content; margin: 14px auto 0; }
        .badge-dialog .dialog-body { padding-top: 12px; }
        .event-card { padding: 20px 14px; }
        .swims th, .swims td { padding: 10px 6px; }
        .swims td { font-size: 15px; }
        .time-cell { gap: 4px 6px; }
        .time { min-width: 3.9em; }
        .change { min-width: 4.4em; }
    }
</style>
</head>
<body>
<site-header current="stats"></site-header>
<main class="wrap narrow">
    <section class="page-title">
        <h1>Swimmer Stats</h1>
        <p>Pick a swimmer to see their times and results across the season.</p>
    </section>

    <div class="stats-stack">
        <section class="card">
            <label class="picker-label" for="swimmerSelect">Swimmer</label>
            <select class="input swimmer-select" id="swimmerSelect"><option value="">Loading swimmers…</option></select>
        </section>
        <div class="stats-list" id="swimmerContent"></div>
        <p class="sr-only" id="swimmerStatus" role="status"></p>
    </div>
</main>
<site-footer></site-footer>

<dialog class="dialog badge-dialog" id="badgeDialog" aria-labelledby="badgeDialogTitle" aria-describedby="badgeDialogAbout">
    <div class="dialog-grab" aria-hidden="true"></div>
    <div class="dialog-head">
        <button type="button" class="dialog-close" data-close-dialog aria-label="Close badge"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="dialog-body">
        <div class="badge-big">
            <span class="badge-disc" id="badgeDialogDisc" aria-hidden="true"></span>
            <h2 id="badgeDialogTitle"></h2>
            <p id="badgeDialogAbout"></p>
        </div>
        <div class="inset badge-earned">
            <p class="earned-label">How it was earned</p>
            <p class="earned-value" id="badgeDialogHow"></p>
            <p class="earned-label">Earned at</p>
            <p class="earned-value" id="badgeDialogWhere"></p>
        </div>
        <button type="button" class="btn primary block badge-done" data-close-dialog>Done</button>
    </div>
</dialog>
<script>
const { escapeHtml, fmtDate, fmtShortDate, fmtSeconds, displayName, initials, shortEventName, plural } = Meets;

// For each opponent's short name, and the results popup its name opens.
let meetsById = {};
const meetsReady = fetch('/api/meets')
    .then(res => (res.ok ? res.json() : []))
    .catch(() => [])
    .then(meets => { meetsById = Object.fromEntries(meets.map(m => [m.id, m])); });

/* ---------------- Header card ---------------- */
function swimmerHeader(season) {
    const about = [season.age != null && `Age ${season.age}`, season.season && `${season.season} season`].filter(Boolean).join(' · ');
    return `
        <section class="hero-card swimmer-hero" aria-labelledby="swimmerName">
            <div class="swimmer-head">
                <span class="swimmer-avatar" aria-hidden="true">${escapeHtml(initials(season.name))}</span>
                <div>
                    <h2 id="swimmerName">${escapeHtml(displayName(season.name))}</h2>
                    ${about ? `<p>${escapeHtml(about)}</p>` : ''}
                </div>
            </div>
            ${badgesHtml(season.badges || [])}
            ${stripHtml(season)}
        </section>`;
}

/* ---------------- Badges ---------------- */
// Worked out on the server after each import (api/shared/badges.js) and sent
// in display order: New ones first, then the rarest, First Splash last.
// The icons are the badge mockup's (design/update-2).
const BADGE_ICONS = {
    splash: '<path d="M2 17c2 0 2-1.5 4-1.5S8 17 10 17s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5M2 21c2 0 2-1.5 4-1.5S8 21 10 21s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5M12 3v7M8.5 6.5 12 10l3.5-3.5"/>',
    pb: '<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>',
    streak: '<path d="M3 18l5-5 4 3 8-9M15 7h5v5"/>',
    barrier: '<circle cx="12" cy="13" r="7"/><path d="M12 9.5V13l2.5 1.5M10 3h4"/>',
    distance: '<path d="M3 12h18M3 8v8M21 8v8M7 9l-4 3 4 3M17 9l4 3-4 3"/>',
    podium: '<path d="M3 20v-6h5v6zM8 20V8h8v12zM16 20v-8h5v8z"/>',
    champion: '<path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v4M8 20h8"/>',
    scorer: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/>',
    triple: '<path d="M12 3l1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6L6.8 6.8l3.6-.5z"/><path d="M8 16l-2 5 3-1.5M16 16l2 5-3-1.5M12 15v6"/>',
    relay: '<path d="M4 8h13l-3-3M20 16H7l3 3"/>',
    anchor: '<path d="M12 8v13M8 12h8M5 15a7 7 0 0 0 14 0M12 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>',
    rounded: '<path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 3v18M3 12h18"/>',
    dropper: '<path d="M12 3s6 6.2 6 10.5a6 6 0 0 1-12 0C6 9.2 12 3 12 3z"/>'
};
const BADGES_SHOWN = { wide: 10, phone: 6 }; // matches the nth-child rules in the styles above

// The gold disc: the icon, and the swimmer's count or total in a green pill.
function badgeDisc(badge) {
    const icon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${BADGE_ICONS[badge.id] || ''}</svg>`;
    return icon + (badge.pill ? `<span class="badge-pill">${escapeHtml(badge.pill)}</span>` : '');
}

// The pill and sub-label as they'd be read aloud: "×5" is "5 times", "Under 1:00" is "under 1 minute".
function spokenPill(badge) {
    if (!badge.pill) return '';
    const count = badge.pill.replace(/^×/, '');
    if (badge.id === 'streak') return `${count} meets in a row`;
    if (badge.id === 'relay') return `${count} relay legs`;
    if (count !== badge.pill) return `${count} times`;
    return badge.pill.replace(/ pts$/, ' points').replace(/ m$/, ' meters').replace(/(\d)s$/, '$1 seconds');
}
function spokenSub(sub) {
    return (sub || '').replace('1:00', '1 minute').replace(/(\d)s$/, '$1 seconds');
}

function badgeTile(badge, index) {
    const date = badge.meetDate ? fmtDate(badge.meetDate) : '';
    const label = [badge.name, spokenPill(badge), spokenSub(badge.sub), date && `earned ${date}`, badge.isNew && 'new'].filter(Boolean).join(', ');
    const when = badge.sub || date;
    return `
        <button type="button" class="badge-tile" data-badge="${index}" aria-label="${escapeHtml(label)}">
            ${badge.isNew ? '<span class="badge-new">New</span>' : ''}
            <span class="badge-disc">${badgeDisc(badge)}</span>
            <span class="badge-name">${escapeHtml(badge.name)}</span>
            ${when ? `<span class="badge-when">${escapeHtml(when)}</span>` : ''}
        </button>`;
}

function badgesHtml(badges) {
    if (!badges.length) return '';
    const fresh = badges.filter(b => b.isNew).length;
    // "all": more than either screen shows; "phone": more than a phone shows.
    const more = badges.length > BADGES_SHOWN.wide ? 'all' : badges.length > BADGES_SHOWN.phone ? 'phone' : '';
    return `
        <div class="badges-head">
            <h3>Badges</h3>
            <span class="badges-count">${plural(badges.length, 'badge', 'badges')}${fresh ? ` · ${fresh} new` : ''}</span>
        </div>
        <div class="badge-area"${more ? ` data-more="${more}"` : ''}>
            <div class="badge-grid" id="badgeGrid">${badges.map(badgeTile).join('')}</div>
            ${more ? `<button type="button" class="btn on-dark small show-all" aria-controls="badgeGrid">Show all ${badges.length} badges</button>` : ''}
        </div>`;
}

// Shows every badge, and moves focus to the first one that was hidden.
function showAllBadges(button) {
    const grid = document.getElementById('badgeGrid');
    const hidden = [...grid.children].filter(tile => !tile.getClientRects().length);
    grid.classList.add('expanded');
    button.remove();
    if (hidden.length) hidden[0].focus();
}

function openBadge(badge, opener) {
    const meet = meetsById[badge.meetId];
    document.getElementById('badgeDialogDisc').innerHTML = badgeDisc(badge);
    document.getElementById('badgeDialogTitle').textContent = badge.name;
    document.getElementById('badgeDialogAbout').textContent = badge.description;
    document.getElementById('badgeDialogHow').textContent = badge.detail;
    // "July 13 · at Curtis Park"
    document.getElementById('badgeDialogWhere').textContent = [badge.meetDate && fmtDate(badge.meetDate), meet && meet.title].filter(Boolean).join(' · ');
    const dialog = document.getElementById('badgeDialog');
    SiteUI.openDialog(dialog, opener);
    dialog.querySelector('.dialog-body').scrollTop = 0;
}

/* ---------------- Stat strip ---------------- */
// Up to three of these, in the order the server picked (api/shared/stats.js statStrip).
const STRIP = {
    mostImproved: item => ({
        value: `−${item.seconds.toFixed(2)}s`,
        spoken: `${item.seconds.toFixed(2)} seconds faster`,
        label: 'Most improved',
        more: [shortEventName(item.eventName), item.meetDate && fmtDate(item.meetDate)].filter(Boolean).join(' · ')
    }),
    points: item => ({ value: item.value, label: 'Points for the team' }),
    personalBests: item => ({ value: item.value, label: 'Personal bests' }),
    relayLegs: item => ({ value: item.value, label: 'Relay legs' })
};

function stripHtml(season) {
    const strip = season.strip || [];
    if (!strip.length) return `<p class="friendly-line">${escapeHtml(friendlyLine(season))}</p>`;
    return `<ul class="stat-strip">${strip.map(item => {
        const { value, spoken, label, more } = STRIP[item.key](item);
        const shown = spoken ? `<span aria-hidden="true">${escapeHtml(value)}</span><span class="sr-only">${escapeHtml(spoken)}</span>` : escapeHtml(value);
        return `<li><span class="strip-value">${shown}</span><span class="strip-label">${label}${more ? ` <small>· ${escapeHtml(more)}</small>` : ''}</span></li>`;
    }).join('')}</ul>`;
}

// When fewer than two strip stats apply yet.
function friendlyLine(season) {
    const first = String(season.name).split(',').pop().trim() || displayName(season.name);
    return season.meetsSwum === 1
        ? `${first}’s first meet is in the books! Stats like personal bests and time dropped start showing up after the next meet.`
        : 'Stats like personal bests and points for the team show up here as the season goes on.';
}

/* ---------------- Event cards ---------------- */
const CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const STATUS_TEXT = { DQ: 'DQ', NS: 'Did not swim', DNF: 'Did not finish' };

function timedSwims(event) {
    return event.swims.filter(s => s.status === 'OK' && s.officialSeconds != null);
}

function eventCard(event, index) {
    return `
        <section class="card event-card" aria-labelledby="event-${index}">
            <div class="event-head">
                <h3 id="event-${index}">${escapeHtml(event.eventName)}</h3>
                ${event.seasonBestSeconds != null ? `<span class="season-best">Season best ${escapeHtml(fmtSeconds(event.seasonBestSeconds))}</span>` : ''}
            </div>
            ${timedSwims(event).length > 1 ? `<div class="inset chart-box" data-event="${index}" aria-hidden="true"></div>` : ''}
            <table class="swims">
                <thead><tr><th scope="col">Meet</th><th scope="col">Opponent</th><th scope="col">Time</th><th scope="col" class="r">Place</th></tr></thead>
                <tbody>${event.swims.map(swimRow).join('')}</tbody>
            </table>
        </section>`;
}

function swimRow(swim) {
    const meet = meetsById[swim.meetId];
    const opponent = meet ? meet.shortName || meet.opponent : '';
    // Only a meet with its numbers saved has a popup to open.
    const opponentCell = meet && meet.summary
        ? `<button type="button" class="opponent-link" data-meet="${escapeHtml(swim.meetId)}">${escapeHtml(opponent)}<span class="sr-only">, meet results</span>${CHEVRON}</button>`
        : escapeHtml(opponent);
    return `<tr><td>${escapeHtml(fmtShortDate(swim.meetDate))}</td><td>${opponentCell}</td><td>${timeCell(swim)}</td><td class="r">${placeCell(swim)}</td></tr>`;
}

// Time, then the change from the previous swim in this event, then a PB tag.
// A DQ, no-show, or did-not-finish shows that instead; an exhibition swim
// isn't scored, so it gets no change or PB.
function timeCell(swim) {
    if (swim.status === 'EXH') return `<div class="time-cell"><span class="time">${escapeHtml(swim.officialTime)}</span><span class="badge">Exhibition</span></div>`;
    if (swim.status !== 'OK') return `<span class="swim-status">${escapeHtml(STATUS_TEXT[swim.status] || swim.status)}</span>`;
    const pb = swim.personalBest ? '<span class="pb-tag"><span aria-hidden="true">PB</span><span class="sr-only">Personal best</span></span>' : '';
    return `<div class="time-cell"><span class="time">${escapeHtml(swim.officialTime)}</span>${changeHtml(swim.change)}${pb}</div>`;
}

function changeHtml(change) {
    if (!change) return '<span class="change"></span>'; // first swim in the event, or no change; still holds the column
    const faster = change < 0;
    const seconds = Math.abs(change).toFixed(2);
    return `<span class="change ${faster ? 'faster' : 'slower'}"><span aria-hidden="true">${faster ? '▼' : '▲'} ${seconds}s</span><span class="sr-only">${seconds} seconds ${faster ? 'faster' : 'slower'}</span></span>`;
}

function placeCell(swim) {
    if (swim.status !== 'OK' || swim.place == null) return '';
    return `<span class="place${swim.place <= 3 ? ' podium' : ''}">${escapeHtml(swim.place)}</span>`;
}

/* ---------------- Charts ---------------- */
// One event's times across the season. Lower on the chart is faster, and the
// fastest swim is the gold dot. When the dots are close together, only the
// first, last, and fastest get labels; the table below has every time.
function chartSvg(swims, width) {
    const H = 190, L = 40, R = 40, T = 40, B = 44;
    const n = swims.length;
    const values = swims.map(s => s.officialSeconds);
    const min = Math.min(...values);
    const max = Math.max(...values);
    const range = (max - min) || 1;
    const lo = min - range * 0.12;
    const hi = max + range * 0.12;
    const spacing = (width - L - R) / (n - 1);
    const x = i => L + i * spacing;
    const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const fastest = values.indexOf(min);
    const labeled = i => spacing >= 60 || i === 0 || i === n - 1 || i === fastest;
    const dated = i => spacing >= 46 || labeled(i);

    let svg = `<svg width="${width}" height="${H}" viewBox="0 0 ${width} ${H}">`;
    for (const f of [0, 0.5, 1]) {
        const gy = T + f * (H - T - B);
        svg += `<line class="chart-grid" x1="${L}" x2="${width - R}" y1="${gy}" y2="${gy}"/>`;
    }
    svg += `<polyline class="chart-line" points="${swims.map((s, i) => `${x(i).toFixed(1)},${y(s.officialSeconds).toFixed(1)}`).join(' ')}"/>`;
    swims.forEach((s, i) => {
        const cx = x(i).toFixed(1);
        const cy = y(s.officialSeconds);
        svg += i === fastest
            ? `<circle class="chart-best-halo" cx="${cx}" cy="${cy.toFixed(1)}" r="12"/><circle class="chart-best" cx="${cx}" cy="${cy.toFixed(1)}" r="8"/>`
            : `<circle class="chart-dot" cx="${cx}" cy="${cy.toFixed(1)}" r="6"/>`;
        if (labeled(i)) svg += `<text class="chart-value" x="${cx}" y="${(cy - 16).toFixed(1)}" text-anchor="middle">${escapeHtml(s.officialTime)}</text>`;
        if (dated(i)) svg += `<text class="chart-date" x="${cx}" y="${H - 14}" text-anchor="middle">${escapeHtml(fmtShortDate(s.meetDate))}</text>`;
    });
    return svg + '</svg>';
}

let shownSeason = null;

// Charts are drawn to the box's width, so they're redrawn when the window resizes.
function drawCharts() {
    if (!shownSeason) return;
    document.querySelectorAll('.chart-box').forEach(box => {
        const width = Math.max(220, Math.floor(box.clientWidth - 16));
        box.innerHTML = chartSvg(timedSwims(shownSeason.events[box.dataset.event]), width) + '<p class="chart-note">Lower is faster</p>';
    });
}
let resizeTimer = null;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(drawCharts, 120);
});

/* ---------------- Loading a swimmer ---------------- */
let loadCount = 0;

async function loadSwimmer(name) {
    const load = ++loadCount;
    const box = document.getElementById('swimmerContent');
    const status = document.getElementById('swimmerStatus');
    shownSeason = null;
    document.title = name ? `${displayName(name)} | Stats | Spotswood Sea Serpents` : 'Stats | Spotswood Sea Serpents';
    if (!name) {
        box.innerHTML = '';
        status.textContent = '';
        return;
    }
    box.innerHTML = '<p class="loading">Loading results…</p>';
    let season = null;
    let problem = '';
    try {
        const [res] = await Promise.all([fetch(`/api/swimmerStats?name=${encodeURIComponent(name)}`), meetsReady]);
        if (res.status === 404) problem = 'No results on record for this swimmer yet.';
        else if (!res.ok) throw new Error(`HTTP ${res.status}`);
        else season = await res.json();
    } catch (e) {
        problem = 'Couldn\'t load results right now.';
    }
    if (load !== loadCount) return; // a newer pick has taken over
    if (!season) {
        box.innerHTML = `<p class="empty">${escapeHtml(problem)}</p>`;
        status.textContent = problem;
        return;
    }
    shownSeason = season;
    box.innerHTML = swimmerHeader(season) + season.events.map(eventCard).join('');
    drawCharts();
    status.textContent = `Showing stats for ${displayName(season.name)}.`;
}

document.getElementById('swimmerContent').addEventListener('click', (event) => {
    const link = event.target.closest('.opponent-link');
    if (link) Meets.openResults(meetsById[link.dataset.meet], link);
    const tile = event.target.closest('.badge-tile');
    if (tile && shownSeason) openBadge(shownSeason.badges[tile.dataset.badge], tile);
    const more = event.target.closest('.show-all');
    if (more) showAllBadges(more);
});

/* ---------------- Swimmer dropdown ---------------- */
// A pick loads on this page and goes into the address, so a swimmer's stats
// can be bookmarked or shared (the home page's dropdown links here the same way).
const select = document.getElementById('swimmerSelect');
let pickTimer = null;
select.addEventListener('change', () => {
    // Arrow keys step through the names one at a time; load once they pause.
    clearTimeout(pickTimer);
    pickTimer = setTimeout(() => {
        history.replaceState(null, '', select.value ? `?swimmer=${encodeURIComponent(select.value)}` : location.pathname);
        loadSwimmer(select.value);
    }, 150);
});

(async function () {
    try {
        const res = await fetch('/api/swimmerStats');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { swimmers } = await res.json();
        if (!swimmers.length) {
            select.innerHTML = '<option value="">No swimmers on record yet</option>';
            return;
        }
        select.innerHTML = '<option value="">Choose a swimmer…</option>' + swimmers.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
        const preset = new URLSearchParams(location.search).get('swimmer');
        if (preset && swimmers.includes(preset)) {
            select.value = preset;
            loadSwimmer(preset);
        } else if (preset) {
            document.getElementById('swimmerContent').innerHTML = '<p class="empty">We couldn\'t find that swimmer. Pick one from the list above.</p>';
        }
    } catch (e) {
        select.innerHTML = '<option value="">Couldn\'t load swimmers</option>';
    }
})();
</script>
