<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule | Spotswood Sea Serpents</title>
<meta name="description" content="Meet schedule for the Spotswood Sea Serpents summer swim team.">
<!-- Link previews when the site is shared in a text or post, and saving it to a
     phone's home screen (/manifest.json; 2026-10-23). The share image needs the
     site's full address: change it here if the site moves to its own domain. -->
<meta property="og:site_name" content="Spotswood Sea Serpents">
<meta property="og:title" content="Schedule | Spotswood Sea Serpents">
<meta property="og:description" content="This season's meets, with results.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ambitious-island-0f3bf570f.4.azurestaticapps.net/schedule.html">
<meta property="og:image" content="https://ambitious-island-0f3bf570f.4.azurestaticapps.net/assets/share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A Spotswood swimmer behind the blocks, looking down the lanes">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-title" content="Sea Serpents">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="/assets/favicon-48.png">
<link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/poppins-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/site.js"></script>
<script src="/assets/meets.js"></script>
<style>
    /* Schedule page only. The meet cards and popups come from /assets/site.css. */
    .schedule { display: flex; flex-direction: column; gap: 30px; max-width: 760px; padding-bottom: 80px; }
    .meet-group { display: flex; flex-direction: column; gap: 16px; }
    #pastHeading { scroll-margin-top: 16px; }
    .group-label { margin: 0 0 -2px; font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-on-page); }
    .none-yet, .loading, .empty { margin: 0; font-size: 16px; color: var(--muted-on-page); }
</style>
</head>
<body>
<site-header current="schedule"></site-header>
<main class="wrap">
    <section class="page-title">
        <h1>Meet Schedule</h1>
        <p>All meets for the season. Forecasts appear automatically once a meet is about a week out.</p>
    </section>
    <div class="schedule" id="schedule"><p class="loading">Loading meets…</p></div>
</main>

<script>
// Upcoming meets on gold cards, the next one with its forecast, Map,
// and Add to calendar; then past meets, newest first, each on the green
// (or gray-green) result card. The cards are shared
// with the home page (/assets/meets.js).
let meetsById = {};

(async function () {
    const box = document.getElementById('schedule');
    let meets;
    try {
        const res = await fetch('/api/meets');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        meets = await res.json();
    } catch (e) {
        box.innerHTML = '<p class="empty">Couldn\'t load the schedule right now.</p>';
        return;
    }
    meetsById = Object.fromEntries(meets.map(m => [m.id, m]));
    const { upcoming, past } = Meets.splitMeets(meets);
    box.innerHTML = `
        <section class="meet-group" aria-labelledby="upcomingHeading">
            <h2 class="group-label" id="upcomingHeading">Upcoming</h2>
            ${upcoming.length ? upcoming.map(() => '<article class="gold-card upcoming"></article>').join('') : '<p class="none-yet">No upcoming meets yet.</p>'}
        </section>
        ${past.length ? `
            <section class="meet-group" aria-labelledby="pastHeading">
                <h2 class="group-label" id="pastHeading">Past meets</h2>
                ${past.map(Meets.resultCard).join('')}
            </section>` : ''}`;
    box.querySelectorAll('article.upcoming').forEach((card, i) => Meets.showUpcoming(card, upcoming[i], { next: i === 0 }));
    // The homepage's "All results" link lands on the past meets.
    if (location.hash === '#past' && document.getElementById('pastHeading')) document.getElementById('pastHeading').scrollIntoView();
})();

// "See team stats" on each past meet's card.
document.getElementById('schedule').addEventListener('click', (event) => {
    const button = event.target.closest('[data-meet-stats]');
    if (button) Meets.openResults(meetsById[button.dataset.meetStats], button);
});
</script>
</body>
</html>
