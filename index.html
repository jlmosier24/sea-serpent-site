<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotswood Sea Serpents</title>
<meta name="description" content="Spotswood Sea Serpents summer swim team -- meet schedule, results, and photos.">
<meta property="og:title" content="Spotswood Sea Serpents">
<meta property="og:description" content="Spotswood Sea Serpents summer swim team -- meet schedule, results, and photos.">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M4 30c4-6 8-6 12 0s8 6 12 0 8-6 12 0 8 6 12 0' stroke='%232F8F3E' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/site.js"></script>
<script src="/assets/meets.js"></script>
<script src="/assets/swimmers.js"></script>
<script src="/assets/photos.js"></script>
<style>
    /* Home page only. Cards, buttons, tiles, dialogs, and the meet cards come from /assets/site.css. */
    /* The team photo across the top, rounded like the cards, with the welcome
       and two links over a dark fade at its bottom so the white text reads. */
    .hero { position: relative; height: 420px; margin: 18px 0 32px; border-radius: var(--radius-card); overflow: hidden; background: var(--hero-to); }
    .hero img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; }
    .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,30,12,.8) 0%, rgba(10,30,12,.32) 45%, rgba(10,30,12,0) 75%); pointer-events: none; }
    .hero-text { position: absolute; z-index: 1; left: 36px; right: 36px; bottom: 32px; color: #fff; }
    .hero h1 { font-size: 52px; font-weight: 700; line-height: 1.05; margin: 0 0 10px; }
    .hero-intro { max-width: 520px; margin: 0 0 18px; font-size: 18px; color: rgba(255,255,255,.92); }
    /* Phones only: a short label under the heading in place of the intro line. */
    .hero-tag { display: none; margin: 0 0 16px; font-size: 12.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.9); }
    .hero-links { display: flex; flex-wrap: wrap; gap: 10px; }

    .home-grid { display: grid; grid-template-columns: 1fr 1.45fr; gap: 32px; align-items: start; padding-bottom: 80px; }
    .home-stack { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
    .card-head h2 { white-space: nowrap; }
    .loading, .empty { margin: 0; padding: 24px 0; color: var(--muted); text-align: center; }

    /* Schedule card: the next meet and the last one, each under a small label. */
    .meet-part + .meet-part { margin-top: 24px; }
    .part-label { margin: 0 0 10px; font-family: Inter, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }


    /* Photo card: the newest photos in rows (Photos.showRows, /assets/photos.js). It
       scrolls with the page: with more rows it can be taller than the window. */
    .photo-card { min-width: 0; }

    @media (max-width: 860px) {
        .hero h1 { font-size: 42px; }
        .hero { height: 380px; }
        .home-grid { grid-template-columns: 1fr; }
    }
    /* Phones: a smaller heading, so the next meet shows without scrolling. */
    @media (max-width: 600px) {
        /* The short label replaces the intro line here, so the heading sits below the swimmer's cap. */
        .hero { height: 340px; margin: 8px 0 24px; border-radius: 22px; }
        .hero-text { left: 18px; right: 18px; bottom: 20px; }
        .hero h1 { font-size: 32px; margin-bottom: 6px; }
        .hero-intro { display: none; }
        .hero-tag { display: block; }
    }
    /* Small phones: the label stays on one line and the buttons side by side. */
    @media (max-width: 370px) {
        .hero-tag { font-size: 11.5px; letter-spacing: .07em; }
        .hero-links { flex-wrap: nowrap; gap: 8px; }
        .hero-links .btn { padding: 10px 16px; font-size: 14.5px; }
    }
</style>
</head>
<body>
<site-header current="home"></site-header>
<main class="wrap">
    <section class="hero">
        <picture>
            <source type="image/webp" srcset="/assets/hero-800.webp?v=2 800w, /assets/hero-1600.webp?v=2 1600w" sizes="(max-width: 1180px) 100vw, 1132px">
            <img src="/assets/hero-1600.jpg?v=2" srcset="/assets/hero-800.jpg?v=2 800w, /assets/hero-1600.jpg?v=2 1600w" sizes="(max-width: 1180px) 100vw, 1132px" width="1600" height="1066" fetchpriority="high" alt="A Sea Serpents swimmer in a team cap waits behind the lanes at a home meet">
        </picture>
        <div class="hero-text">
            <h1>Sea Serpents</h1>
            <p class="hero-tag">Spotswood summer swim team</p>
            <p class="hero-intro">Meet schedules, season stats, and photos for the Spotswood Sea Serpents summer swim team.</p>
            <div class="hero-links"><a class="btn on-dark" href="/schedule.html">Schedule</a><a class="btn ghost-on-dark" href="/stats.html">Swimmer stats</a></div>
        </div>
    </section>

    <div class="home-grid">
        <div class="home-stack">
            <section class="card" aria-labelledby="statsHeading">
                <div class="card-head"><h2 id="statsHeading">Swimmer Stats</h2><a href="/stats.html">Full stats →</a></div>
                <div id="swimmerPicker"></div>
            </section>

            <section class="card" id="scheduleCard" aria-labelledby="scheduleHeading">
                <div class="card-head"><h2 id="scheduleHeading">Schedule</h2><a href="/schedule.html">Full schedule →</a></div>
                <div class="meet-part" id="nextPart" hidden>
                    <h3 class="part-label">Next meet</h3>
                    <article class="gold-card upcoming" id="nextMeet"></article>
                </div>
                <div class="meet-part" id="lastPart" hidden>
                    <h3 class="part-label">Last meet</h3>
                    <div id="lastMeet"></div>
                </div>
                <p class="loading" id="meetsStatus">Loading meets…</p>
            </section>
        </div>

        <section class="card photo-card" aria-labelledby="photoHeading">
            <div class="card-head"><h2 id="photoHeading">Photos</h2><a href="/gallery.html">All photos →</a></div>
            <div id="galleryContent"><p class="loading">Loading photos…</p></div>
        </section>
    </div>
</main>

<script>
/* ---------------- Meets ---------------- */
// The cards themselves are shared with the Schedule page (/assets/meets.js).

async function loadMeets() {
    let meets;
    try {
        const res = await fetch('/api/meets');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        meets = await res.json();
    } catch (e) {
        showMeetsStatus('Couldn\'t load the meets right now.');
        return;
    }
    const { upcoming, past } = Meets.splitMeets(meets);
    const next = upcoming[0];
    // Only a meet with results here; the Schedule page lists the rest too.
    const last = past.find(Meets.hasResults);
    renderNextMeet(next);
    renderLastMeet(last);
    if (next || last) document.getElementById('meetsStatus').hidden = true;
    else showMeetsStatus('No meets on the schedule yet.');
}

function showMeetsStatus(text) {
    const status = document.getElementById('meetsStatus');
    status.className = 'empty';
    status.textContent = text;
}

function renderNextMeet(m) {
    document.getElementById('nextPart').hidden = !m;
    if (m) Meets.showUpcoming(document.getElementById('nextMeet'), m, { next: true });
}

// The latest finished meet; "See team stats" opens its popup.
function renderLastMeet(m) {
    document.getElementById('lastPart').hidden = !m;
    if (!m) return;
    const box = document.getElementById('lastMeet');
    box.innerHTML = Meets.resultCard(m);
    const button = box.querySelector('[data-meet-stats]');
    if (button) button.addEventListener('click', () => Meets.openResults(m, button));
}

/* ---------------- Swimmer search ---------------- */
// The same search and Favorites as the Stats page (/assets/swimmers.js);
// picking a swimmer opens their Stats page.
const picker = Swimmers.mountSearch(document.getElementById('swimmerPicker'), {
    onPick(name) {
        if (name) location.href = `/stats.html?swimmer=${encodeURIComponent(name)}`;
    }
});

async function loadSwimmers() {
    try {
        const res = await fetch('/api/swimmerStats');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        picker.setList(await res.json());
    } catch (e) {
        picker.failed();
    }
}

// Back from a swimmer's page, the browser can show this page as it was left;
// start the search over, and pick up any favorites changed there.
window.addEventListener('pageshow', (event) => {
    if (!event.persisted) return;
    picker.showName('');
    picker.renderFavorites();
});

/* ---------------- Photo card ---------------- */
// The newest photos in rows of whole photos; tapping one
// opens the viewer, which goes on through every photo.
let allPhotos = [];

async function loadPhotos() {
    const box = document.getElementById('galleryContent');
    try {
        const res = await fetch('/api/galleryPublic');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        allPhotos = await res.json();
    } catch (e) {
        box.innerHTML = '<p class="empty">Couldn\'t load the photos right now.</p>';
        return;
    }
    if (!allPhotos.length) {
        box.innerHTML = '<p class="empty">No photos yet. Be the first to share one!</p>';
        return;
    }
    // Phones: three full rows. Wider: up to six rows beside the Schedule card,
    // the last one even if it's short, so more of the photos show.
    const phone = width => width < 500;
    Photos.showRows(box, allPhotos, {
        targetHeight: width => (phone(width) ? 140 : 150),
        maxRows: width => (phone(width) ? 3 : 6),
        fullRowsOnly: phone
    });
}

document.getElementById('galleryContent').addEventListener('click', (event) => {
    const tile = event.target.closest('.photo-tile');
    if (tile) Photos.open(allPhotos, Number(tile.dataset.index), tile);
});

loadMeets();
loadSwimmers();
loadPhotos();
</script>
</body>
</html>
