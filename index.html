<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotswood Sea Serpents</title>
<meta name="description" content="Spotswood Sea Serpents summer swim team -- meet schedule, results, and photos.">
<meta property="og:title" content="Spotswood Sea Serpents">
<meta property="og:description" content="Spotswood Sea Serpents summer swim team -- meet schedule, results, and photos.">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M4 30c4-6 8-6 12 0s8 6 12 0 8-6 12 0 8 6 12 0' stroke='%232F8F3E' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/site.js"></script>
<script src="/assets/meets.js"></script>
<script src="/assets/photos.js"></script>
<style>
    /* Home page only. Cards, buttons, tiles, dialogs, and the meet cards come from /assets/site.css. */
    .hero { text-align: center; padding: 56px 0 44px; }
    .hero h1 { font-size: 60px; font-weight: 700; line-height: 1.1; margin: 0 0 20px; }
    .hero p { max-width: 560px; margin: 0 auto; font-size: 20px; color: var(--muted-on-page); }

    .home-grid { display: grid; grid-template-columns: 1fr 1.45fr; gap: 32px; align-items: start; padding-bottom: 80px; }
    .home-stack { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
    .card-head h2 { white-space: nowrap; }
    .loading, .empty { margin: 0; padding: 24px 0; color: var(--muted); text-align: center; }

    .swimmer-select { padding: 18px 20px; font-size: 18px; border-radius: 16px; }

    /* Photo card: a slideshow of the newest photos. */
    .photo-card { position: sticky; top: 64px; min-width: 0; }
    .photo-frame { position: relative; }
    .photo-open { display: block; width: 100%; padding: 0; border: 0; border-radius: 22px; overflow: hidden; background: var(--soft); cursor: zoom-in; }
    .photo-open img { display: block; width: 100%; aspect-ratio: 4 / 4.2; object-fit: cover; object-position: 50% 30%; transition: opacity .5s ease; }
    .photo-pause { position: absolute; right: 12px; bottom: 12px; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: rgba(16,36,15,.62); color: #fff; cursor: pointer; }
    .photo-pause:hover { background: rgba(16,36,15,.8); }
    @media (prefers-reduced-motion: reduce) { .photo-open img { transition: none; } }

    @media (max-width: 860px) {
        .hero h1 { font-size: 42px; }
        .home-grid { grid-template-columns: 1fr; }
        .photo-card { position: static; }
    }
</style>
</head>
<body>
<site-header current="home"></site-header>
<main class="wrap">
    <section class="hero">
        <h1>Go Sea Serpents!</h1>
        <p>Meet schedules, season stats, and photos for the Spotswood Sea Serpents summer swim team.</p>
    </section>

    <div class="home-grid">
        <div class="home-stack">
            <section class="card" aria-labelledby="statsHeading">
                <div class="card-head"><h2 id="statsHeading">Swimmer Stats</h2><a href="/stats.html" id="fullStatsLink">Full stats →</a></div>
                <select class="input swimmer-select" id="swimmerSelect" aria-label="Choose a swimmer"><option value="">Loading swimmers…</option></select>
            </section>

            <section class="card" id="nextMeetCard" aria-labelledby="nextMeetHeading" hidden>
                <div class="card-head"><h2 id="nextMeetHeading">Next Meet</h2><a href="/schedule.html">Full schedule →</a></div>
                <article class="gold-card upcoming" id="nextMeet"></article>
            </section>

            <section class="card" id="previousMeetCard" aria-labelledby="previousMeetHeading">
                <div class="card-head"><h2 id="previousMeetHeading">Previous Meet</h2><a href="/schedule.html">Full schedule →</a></div>
                <div id="previousMeet"><p class="loading">Loading meets…</p></div>
            </section>
        </div>

        <section class="card photo-card" aria-labelledby="photoHeading">
            <div class="card-head"><h2 id="photoHeading">Photo Gallery</h2><a href="/gallery.html">Full gallery →</a></div>
            <div id="galleryContent"><p class="loading">Loading photos…</p></div>
        </section>
    </div>
</main>

<script>
/* ---------------- Helpers ---------------- */
const { escapeHtml } = Meets;
const icon = SiteUI.icon;

/* ---------------- Meets ---------------- */
// The cards themselves are shared with the Schedule page (/assets/meets.js).
let meetsById = {};

async function loadMeets() {
    let meets;
    try {
        const res = await fetch('/api/meets');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        meets = await res.json();
    } catch (e) {
        document.getElementById('previousMeet').innerHTML = '<p class="empty">Couldn\'t load the meets right now.</p>';
        return;
    }
    meetsById = Object.fromEntries(meets.map(m => [m.id, m]));
    const { upcoming, past } = Meets.splitMeets(meets);
    renderNextMeet(upcoming[0]);
    // Only meets with results here; the Schedule page lists the rest too.
    renderPreviousMeets(past.filter(Meets.hasResults));
}

function renderNextMeet(m) {
    document.getElementById('nextMeetCard').hidden = !m;
    if (m) Meets.showUpcoming(document.getElementById('nextMeet'), m, { next: true });
}

// The latest finished meet, and the one before it as a single row.
function renderPreviousMeets(done) {
    const card = document.getElementById('previousMeetCard');
    if (!done.length) {
        card.hidden = true;
        return;
    }
    const box = document.getElementById('previousMeet');
    box.innerHTML = Meets.resultCard(done[0]) + (done[1] ? Meets.miniRow(done[1]) : '');
    box.querySelectorAll('[data-meet-stats]').forEach(button => {
        button.addEventListener('click', () => Meets.openResults(meetsById[button.dataset.meetStats], button));
    });
}

/* ---------------- Swimmer dropdown ---------------- */
async function loadSwimmers() {
    const select = document.getElementById('swimmerSelect');
    try {
        const res = await fetch('/api/swimmerStats');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { swimmers } = await res.json();
        select.innerHTML = swimmers.length
            ? '<option value="">Choose a swimmer…</option>' + swimmers.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')
            : '<option value="">No swimmers on record yet</option>';
    } catch (e) {
        select.innerHTML = '<option value="">Couldn\'t load swimmers</option>';
    }
}

function statsUrl(name) {
    return name ? `/stats.html?swimmer=${encodeURIComponent(name)}` : '/stats.html';
}

// Picking a swimmer opens their Stats page. On Windows, arrow keys change a
// closed dropdown as they go, so a keyboard pick waits for Enter instead of
// leaving the page on the first key press. "Full stats" follows the pick either way.
(function () {
    const select = document.getElementById('swimmerSelect');
    let pickedWithPointer = false;
    select.addEventListener('pointerdown', () => { pickedWithPointer = true; });
    select.addEventListener('keydown', (event) => {
        pickedWithPointer = false;
        // After the key's own work, which may have just chosen a name.
        if (event.key === 'Enter') setTimeout(() => { if (select.value) location.href = statsUrl(select.value); }, 0);
    });
    select.addEventListener('change', () => {
        document.getElementById('fullStatsLink').href = statsUrl(select.value);
        if (pickedWithPointer && select.value) location.href = statsUrl(select.value);
    });
    // Back from a swimmer's page, the browser can show this page as it was left;
    // start over so picking that same swimmer again still works.
    window.addEventListener('pageshow', (event) => {
        if (!event.persisted) return;
        select.value = '';
        document.getElementById('fullStatsLink').href = statsUrl('');
    });
})();

/* ---------------- Photo card ---------------- */
// A slideshow of the newest photos. It pauses while the pointer is over it,
// stops when keyboard focus reaches it, and has its own pause button.
const SLIDESHOW_MAX = 10;
const SLIDESHOW_INTERVAL_MS = 4500;
const slideshow = { photos: [], shown: 0, timer: null, paused: false, hovering: false };

async function loadPhotos() {
    const box = document.getElementById('galleryContent');
    let photos;
    try {
        const res = await fetch('/api/galleryPublic');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        photos = await res.json();
    } catch (e) {
        box.innerHTML = '<p class="empty">Couldn\'t load the photos right now.</p>';
        return;
    }
    if (!photos.length) {
        box.innerHTML = '<p class="empty">No photos yet. Be the first to share one!</p>';
        return;
    }
    slideshow.photos = photos.slice(0, SLIDESHOW_MAX);
    slideshow.shown = 0;
    const rotates = slideshow.photos.length > 1 && !matchMedia('(prefers-reduced-motion: reduce)').matches;
    const first = slideshow.photos[0];
    box.innerHTML = `
        <div class="photo-frame">
            <button type="button" class="photo-open" aria-label="View this photo full size"><img id="slideshowImg" src="${escapeHtml(first.url)}" alt="${escapeHtml(first.caption || 'Team photo')}"></button>
            ${rotates ? `<button type="button" class="photo-pause" aria-label="Pause slideshow">${icon('pause')}</button>` : ''}
        </div>`;
    box.querySelector('.photo-open').addEventListener('click', (event) => Photos.open(slideshow.photos, slideshow.shown, event.currentTarget));
    if (rotates) startSlideshow(box.querySelector('.photo-frame'));
}

function startSlideshow(frame) {
    const pauseButton = frame.querySelector('.photo-pause');
    function setPaused(paused) {
        slideshow.paused = paused;
        pauseButton.setAttribute('aria-label', paused ? 'Play slideshow' : 'Pause slideshow');
        pauseButton.innerHTML = icon(paused ? 'play' : 'pause');
        syncSlideshow();
    }
    pauseButton.addEventListener('click', () => setPaused(!slideshow.paused));
    frame.addEventListener('mouseenter', () => { slideshow.hovering = true; syncSlideshow(); });
    frame.addEventListener('mouseleave', () => { slideshow.hovering = false; syncSlideshow(); });
    frame.addEventListener('focusin', (event) => {
        if (!slideshow.paused && event.target.matches(':focus-visible')) setPaused(true);
    });
    syncSlideshow();
}

function syncSlideshow() {
    const run = !slideshow.paused && !slideshow.hovering;
    if (run && !slideshow.timer) slideshow.timer = setInterval(showNextPhoto, SLIDESHOW_INTERVAL_MS);
    if (!run && slideshow.timer) {
        clearInterval(slideshow.timer);
        slideshow.timer = null;
    }
}

// Fade out, swap once the next photo has loaded, fade back in.
function showNextPhoto() {
    const img = document.getElementById('slideshowImg');
    const index = (slideshow.shown + 1) % slideshow.photos.length;
    const photo = slideshow.photos[index];
    const next = new Image();
    next.src = photo.url;
    img.style.opacity = '0';
    Promise.all([next.decode().catch(() => {}), new Promise(resolve => setTimeout(resolve, 500))]).then(() => {
        img.src = photo.url;
        img.alt = photo.caption || 'Team photo';
        img.style.opacity = '1';
        slideshow.shown = index;
    });
}

loadMeets();
loadSwimmers();
loadPhotos();
</script>
</body>
</html>
