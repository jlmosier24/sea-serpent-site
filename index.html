<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotswood Sea Serpents</title>
<meta name="description" content="Spotswood Sea Serpents summer swim team -- meet schedule, results, and photos.">
<meta property="og:title" content="Spotswood Sea Serpents">
<meta property="og:description" content="Spotswood Sea Serpents summer swim team -- meet schedule, results, and photos.">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M4 30c4-6 8-6 12 0s8 6 12 0 8-6 12 0 8 6 12 0' stroke='%232F8F3E' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/site.js"></script>
<script src="/assets/meets.js"></script>
<style>
    /* Home page only. Cards, buttons, tiles, and dialogs come from /assets/site.css. */
    .hero { text-align: center; padding: 56px 0 44px; }
    .hero h1 { font-size: 60px; font-weight: 700; line-height: 1.1; margin: 0 0 20px; }
    .hero p { max-width: 560px; margin: 0 auto; font-size: 20px; color: var(--muted-on-page); }

    .home-grid { display: grid; grid-template-columns: 1fr 1.45fr; gap: 32px; align-items: start; padding-bottom: 80px; }
    .home-stack { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
    .card-head h2 { white-space: nowrap; }
    .loading, .empty { margin: 0; padding: 24px 0; color: var(--muted); text-align: center; }
    .ico { width: 18px; height: 18px; flex-shrink: 0; }
    .card-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }

    .swimmer-select { padding: 18px 20px; font-size: 18px; border-radius: 16px; }

    /* Next meet: gold means "coming up". */
    .upcoming { padding: 20px; }
    .upcoming h3 { font-size: 23px; margin: 18px 0 8px; }
    .upcoming-line { display: flex; align-items: center; gap: 8px; margin: 6px 0 0; font-size: 16px; font-weight: 500; color: var(--gold-text); }
    .forecast { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 10px; border: 1px solid var(--gold-border); border-radius: 20px; background: #fff; font-size: 14px; font-weight: 600; }
    .forecast svg { width: 20px; height: 20px; flex-shrink: 0; color: #D58B00; }
    .forecast svg.overcast { color: var(--muted); }
    .forecast.pending { color: var(--muted); font-size: 13px; font-weight: 500; }
    .forecast.pending svg { color: var(--muted); }
    .weather-note { margin: 14px 0 0; padding-top: 12px; border-top: 1px dashed var(--gold-border); font-size: 15px; line-height: 1.45; color: var(--gold-text); }
    .upcoming .btn-row { margin-top: 16px; }
    .upcoming .btn { padding: 10px 16px; }

    /* Previous meet: green, or gray-green after a loss (never red). */
    .result-card .pill { font-size: 14px; }
    .result-chip { padding: 6px 14px; border-radius: var(--radius-round); background: #fff; color: var(--brand); font-size: 13px; font-weight: 700; }
    .result-card.loss .result-chip { background: #E6EAE5; color: #2F3A33; }
    .result-card h3 { font-size: 26px; line-height: 1.15; margin: 18px 0 10px; }
    .score-row { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 19px; }
    .score-row.us { font-weight: 700; }
    .score-row.them { opacity: .92; }
    .result-card.loss .score-row { font-weight: 600; opacity: 1; }
    .score-row svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--gold); }
    .quick-stats { margin: 14px 0 0; font-size: 14px; opacity: .95; }
    .quick-stats b { font-size: 17px; }
    .quick-stats .sep { display: inline-block; width: 4px; height: 4px; margin: 0 10px; border-radius: 50%; background: rgba(255,255,255,.6); vertical-align: middle; }
    .result-card .btn-row { margin-top: 18px; }
    .result-card .btn { padding: 11px 16px; }
    .result-card.loss .btn.on-dark { color: #3A463E; }

    /* The meet before the previous one, as one row. */
    .mini { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 14px; padding: 14px 16px; border: 1px solid var(--soft-border); border-radius: var(--radius-tile); background: var(--soft); color: var(--ink); text-align: left; }
    button.mini { cursor: pointer; }
    button.mini:hover { border-color: var(--brand); }
    .mini-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); flex-shrink: 0; }
    .mini-title { display: block; font-size: 17px; font-weight: 700; }
    .mini-sub { display: block; margin-top: 2px; font-size: 14px; color: var(--muted); }
    .mini > svg { width: 20px; height: 20px; margin-left: auto; color: var(--brand); }

    /* Photo card: a slideshow of the newest photos. */
    .photo-card { position: sticky; top: 64px; min-width: 0; }
    .photo-frame { position: relative; }
    .photo-open { display: block; width: 100%; padding: 0; border: 0; border-radius: 22px; overflow: hidden; background: var(--soft); cursor: zoom-in; }
    .photo-open img { display: block; width: 100%; aspect-ratio: 4 / 4.2; object-fit: cover; object-position: 50% 30%; transition: opacity .5s ease; }
    .photo-pause { position: absolute; right: 12px; bottom: 12px; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: rgba(16,36,15,.62); color: #fff; cursor: pointer; }
    .photo-pause:hover { background: rgba(16,36,15,.8); }
    @media (prefers-reduced-motion: reduce) { .photo-open img { transition: none; } }

    /* Full-screen photo viewer, dark like a phone's photo app. */
    dialog.photo-viewer { width: 100vw; height: 100vh; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: rgba(12,20,14,.94); color: #fff; overflow: hidden; }
    dialog.photo-viewer[open] { display: flex; flex-direction: column; }
    dialog.photo-viewer::backdrop { background: transparent; }
    .photo-viewer-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 64px 16px 8px; }
    .photo-viewer-stage img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
    .photo-viewer-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
    .photo-viewer-bar p { margin: 0; font-size: 15px; color: rgba(255,255,255,.85); }
    .photo-viewer-bar .btn { flex-shrink: 0; }
    .photo-viewer-close { position: absolute; top: 12px; right: 12px; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,.15); color: #fff; cursor: pointer; }
    .photo-viewer-close:hover { background: rgba(255,255,255,.25); }
    .photo-viewer-close svg { width: 22px; height: 22px; }

    @media (max-width: 860px) {
        .hero h1 { font-size: 42px; }
        .home-grid { grid-template-columns: 1fr; }
        .photo-card { position: static; }
    }
</style>
</head>
<body>
<site-header current="home"></site-header>
<main class="wrap">
    <section class="hero">
        <h1>Go Sea Serpents!</h1>
        <p>Meet schedules, season stats, and photos for the Spotswood Sea Serpents summer swim team.</p>
    </section>

    <div class="home-grid">
        <div class="home-stack">
            <section class="card" aria-labelledby="statsHeading">
                <div class="card-head"><h2 id="statsHeading">Swimmer Stats</h2><a href="/stats.html" id="fullStatsLink">Full stats →</a></div>
                <select class="input swimmer-select" id="swimmerSelect" aria-label="Choose a swimmer"><option value="">Loading swimmers…</option></select>
            </section>

            <section class="card" id="nextMeetCard" aria-labelledby="nextMeetHeading" hidden>
                <div class="card-head"><h2 id="nextMeetHeading">Next Meet</h2><a href="/schedule.html">Full schedule →</a></div>
                <article class="gold-card upcoming" id="nextMeet"></article>
            </section>

            <section class="card" id="previousMeetCard" aria-labelledby="previousMeetHeading">
                <div class="card-head"><h2 id="previousMeetHeading">Previous Meet</h2><a href="/schedule.html">Full schedule →</a></div>
                <div id="previousMeet"><p class="loading">Loading meets…</p></div>
            </section>
        </div>

        <section class="card photo-card" aria-labelledby="photoHeading">
            <div class="card-head"><h2 id="photoHeading">Photo Gallery</h2><a href="/gallery.html">Full gallery →</a></div>
            <div id="galleryContent"><p class="loading">Loading photos…</p></div>
        </section>
    </div>
</main>
<site-footer></site-footer>

<dialog id="photoViewer" class="photo-viewer" aria-label="Photo">
    <button type="button" class="photo-viewer-close" data-close-dialog aria-label="Close"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <div class="photo-viewer-stage"><img id="photoViewerImg" alt=""></div>
    <div class="photo-viewer-bar">
        <p id="photoViewerCaption"></p>
        <a id="photoViewerDownload" class="btn primary" hidden>Download</a>
    </div>
</dialog>
<script>
/* ---------------- Helpers ---------------- */
const { escapeHtml, fmtDate, hasScore, outcome, OUTCOME_CHIPS } = Meets;

// "18:00" -> "6:00pm"
function fmtClock(time) {
    if (!time) return '';
    const [hours, minutes] = time.split(':');
    const h = parseInt(hours, 10);
    return `${h % 12 || 12}:${minutes}${h >= 12 ? 'pm' : 'am'}`;
}

// Today on the team's own clock -- at 8pm EDT, UTC is already tomorrow.
function easternToday() {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}

function daysBetween(fromIsoDate, toIsoDate) {
    return Math.round((Date.parse(toIsoDate + 'T00:00:00Z') - Date.parse(fromIsoDate + 'T00:00:00Z')) / 86400000);
}

const ICONS = {
    pin: '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    calendar: '<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/>',
    chart: '<path d="M5 20V10M12 20V4M19 20v-7"/>',
    camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    chevron: '<path d="M9 6l6 6-6 6"/>',
    pause: '<path d="M9 6v12M15 6v12"/>',
    play: '<path d="M8 5.5v13l10-6.5z"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    cloud: '<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>',
    rain: '<path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/><path d="M8 13v8M12 15v8M16 13v8"/>',
    storm: '<path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"/><path d="M13 11l-4 6h6l-4 6"/>'
};
function icon(name, className = 'ico') {
    return `<svg class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
}
const TROPHY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Winner"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>';

/* ---------------- Meets ---------------- */
let meetsById = {};

async function loadMeets() {
    let meets;
    try {
        const res = await fetch('/api/meets');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        meets = await res.json();
    } catch (e) {
        document.getElementById('previousMeet').innerHTML = '<p class="empty">Couldn\'t load the meets right now.</p>';
        return;
    }
    meetsById = Object.fromEntries(meets.map(m => [m.id, m]));

    // A meet is done once it has results or a score, even later the same day.
    const today = easternToday();
    const isDone = m => m.date <= today && (m.resultsImported || hasScore(m));
    const done = meets.filter(isDone).sort((a, b) => b.date.localeCompare(a.date));
    const next = meets.filter(m => m.date >= today && !isDone(m)).sort((a, b) => a.date.localeCompare(b.date))[0];
    renderNextMeet(next);
    renderPreviousMeets(done);
}

/* ---------------- Next meet ---------------- */
function renderNextMeet(m) {
    const card = document.getElementById('nextMeetCard');
    if (!m) {
        card.hidden = true;
        return;
    }
    const where = m.placeName || m.address;
    const destination = m.address || m.placeName;
    const box = document.getElementById('nextMeet');
    box.innerHTML = `
        <div class="card-top">
            <span class="pill">${escapeHtml(fmtDate(m.date))}${m.time ? ` · ${escapeHtml(fmtClock(m.time))}` : ''}</span>
            <span class="forecast" id="forecastChip" hidden></span>
        </div>
        <h3>${escapeHtml(m.title)}</h3>
        ${where ? `<p class="upcoming-line">${icon('pin')}${escapeHtml(where)}</p>` : ''}
        ${m.warmUp ? `<p class="upcoming-line">${icon('clock')}Warm-up at ${escapeHtml(fmtClock(m.warmUp))}</p>` : ''}
        <p class="weather-note" id="weatherNote" hidden></p>
        <div class="btn-row">
            ${destination ? `<a class="btn primary" href="https://www.google.com/maps/dir/?api=1&amp;destination=${encodeURIComponent(destination)}" target="_blank" rel="noopener">${icon('pin')}Directions</a>` : ''}
            <button type="button" class="btn" id="addToCalendar">${icon('calendar')}Add to calendar</button>
        </div>`;
    box.querySelector('#addToCalendar').addEventListener('click', () => downloadCalendarFile(m));
    card.hidden = false;
    loadForecast(m);
}

// The Weather Service forecasts about a week ahead.
const FORECAST_DAYS = 7;

function weatherIcon(shortForecast) {
    const text = shortForecast || '';
    if (/thunder|t-storm/i.test(text)) return icon('storm', 'overcast');
    if (/rain|shower|drizzle/i.test(text)) return icon('rain', 'overcast');
    if (/sunny|clear|fair|hot/i.test(text)) return icon('sun', '');
    return icon('cloud', 'overcast');
}

async function loadForecast(m) {
    if (m.lat == null || m.lon == null) return; // no map location, so no forecast
    const chip = document.getElementById('forecastChip');
    const note = document.getElementById('weatherNote');
    let forecast = null;
    if (daysBetween(easternToday(), m.date) <= FORECAST_DAYS) {
        try {
            const res = await fetch(`/api/meetWeather?lat=${encodeURIComponent(m.lat)}&lon=${encodeURIComponent(m.lon)}&date=${encodeURIComponent(m.date)}`);
            if (res.ok) forecast = await res.json();
        } catch (e) {
            // Shown as "Forecast soon" below.
        }
    }
    if (forecast && forecast.available) {
        // "Chance Showers And Thunderstorms then Mostly Sunny" is a lot for a chip;
        // the start of it fits, and the note below has the whole forecast.
        const conditions = (forecast.shortForecast || '').split(/\s+then\s+/i)[0];
        const summary = [forecast.temperature != null && `${forecast.temperature}°`, conditions].filter(Boolean).join(' · ');
        chip.className = 'forecast';
        chip.innerHTML = `${weatherIcon(forecast.shortForecast)}<span>${escapeHtml(summary)}</span>`;
        note.textContent = forecast.detailedForecast || '';
    } else {
        chip.className = 'forecast pending';
        chip.innerHTML = `${icon('clock', '')}<span>Forecast soon</span>`;
        note.textContent = 'We\'ll show the forecast here a week before the meet.';
    }
    chip.hidden = false;
    note.hidden = !note.textContent;
}

/* ---------------- Add to calendar ---------------- */
// Meets have no end time and calendars need one.
const MEET_LENGTH_HOURS = 3;
// Meet times are Eastern; the file spells out the zone's daylight-saving rules.
const EASTERN_TIMEZONE = [
    'BEGIN:VTIMEZONE', 'TZID:America/New_York',
    'BEGIN:DAYLIGHT', 'TZOFFSETFROM:-0500', 'TZOFFSETTO:-0400', 'TZNAME:EDT', 'DTSTART:20070311T020000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU', 'END:DAYLIGHT',
    'BEGIN:STANDARD', 'TZOFFSETFROM:-0400', 'TZOFFSETTO:-0500', 'TZNAME:EST', 'DTSTART:20071104T020000', 'RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU', 'END:STANDARD',
    'END:VTIMEZONE'
];

function icsText(value) {
    return String(value).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
}

// Calendar file lines stop at 75 bytes; a longer one continues on the next line after a space.
function foldIcsLine(line) {
    const encoder = new TextEncoder();
    let folded = '';
    let bytes = 0;
    for (const ch of line) {
        const size = encoder.encode(ch).length;
        if (bytes + size > 75) {
            folded += '\r\n ';
            bytes = 1;
        }
        folded += ch;
        bytes += size;
    }
    return folded;
}

// "2026-07-22" at "18:00", plus `addHours` -> "20260722T180000" (a wall-clock time, not UTC).
function icsDateTime(date, time, addHours = 0) {
    const [y, mo, d] = date.split('-').map(Number);
    const [h, mi] = time.split(':').map(Number);
    const t = new Date(Date.UTC(y, mo - 1, d, h + addHours, mi));
    return t.toISOString().slice(0, 16).replace(/[-:]/g, '') + '00';
}

function icsDate(date, addDays = 0) {
    const [y, mo, d] = date.split('-').map(Number);
    return new Date(Date.UTC(y, mo - 1, d + addDays)).toISOString().slice(0, 10).replace(/-/g, '');
}

function calendarFile(m) {
    const when = m.time
        ? [`DTSTART;TZID=America/New_York:${icsDateTime(m.date, m.time)}`, `DTEND;TZID=America/New_York:${icsDateTime(m.date, m.time, MEET_LENGTH_HOURS)}`]
        : [`DTSTART;VALUE=DATE:${icsDate(m.date)}`, `DTEND;VALUE=DATE:${icsDate(m.date, 1)}`];
    const location = [m.placeName, m.address].filter(Boolean).join(', ');
    const details = [m.warmUp && `Warm-up at ${fmtClock(m.warmUp)}.`, m.time && `Meet starts at ${fmtClock(m.time)}.`].filter(Boolean).join(' ');
    const lines = [
        'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Spotswood Sea Serpents//Meet schedule//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
        ...(m.time ? EASTERN_TIMEZONE : []),
        'BEGIN:VEVENT',
        `UID:${m.id}@spotswood-sea-serpents`,
        `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '')}`,
        ...when,
        `SUMMARY:${icsText(`Sea Serpents ${m.title}`)}`,
        location && `LOCATION:${icsText(location)}`,
        details && `DESCRIPTION:${icsText(details)}`,
        'END:VEVENT', 'END:VCALENDAR'
    ];
    return lines.filter(Boolean).map(foldIcsLine).join('\r\n') + '\r\n';
}

function downloadCalendarFile(m) {
    const url = URL.createObjectURL(new Blob([calendarFile(m)], { type: 'text/calendar;charset=utf-8' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = `sea-serpents-${m.id}.ics`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------------- Previous meets ---------------- */
function renderPreviousMeets(done) {
    const card = document.getElementById('previousMeetCard');
    if (!done.length) {
        card.hidden = true;
        return;
    }
    const box = document.getElementById('previousMeet');
    box.innerHTML = resultCard(done[0]) + (done[1] ? miniRow(done[1]) : '');
    box.querySelectorAll('[data-meet-stats]').forEach(button => {
        button.addEventListener('click', () => Meets.openResults(meetsById[button.dataset.meetStats], button));
    });
}

function resultCard(m) {
    const result = outcome(m);
    const s = m.summary;
    return `
        <article class="hero-card result-card${result === 'loss' ? ' loss' : ''}">
            <div class="card-top">
                <span class="pill">${escapeHtml(fmtDate(m.date))} · Final</span>
                ${result ? `<span class="result-chip">${OUTCOME_CHIPS[result]}</span>` : ''}
            </div>
            <h3>${escapeHtml(m.title)}</h3>
            ${result ? `
                <p class="score-row us"><span>Spotswood ${escapeHtml(m.teamScore)}</span>${result === 'win' ? TROPHY : ''}</p>
                <p class="score-row them"><span>${escapeHtml(m.opponent)} ${escapeHtml(m.opponentScore)}</span>${result === 'loss' ? TROPHY : ''}</p>` : ''}
            ${s ? `<p class="quick-stats"><b>${s.firstPlaces}</b> ${s.firstPlaces === 1 ? 'first place' : 'first places'}<span class="sep" aria-hidden="true"></span><b>${s.relayWins}</b> ${s.relayWins === 1 ? 'relay win' : 'relay wins'}</p>` : ''}
            <div class="btn-row">
                ${s ? `<button type="button" class="btn on-dark" data-meet-stats="${escapeHtml(m.id)}">${icon('chart')}See team stats</button>` : ''}
                <a class="btn ghost-on-dark" href="/gallery.html?meet=${encodeURIComponent(m.id)}">${icon('camera')}View photos</a>
            </div>
        </article>`;
}

// "Won 550–473": the higher score first, whoever had it.
function scoreLine(m) {
    const result = outcome(m);
    if (!result) return '';
    const verb = { win: 'Won', loss: 'Lost', tie: 'Tied' }[result];
    return `${verb} ${Math.max(m.teamScore, m.opponentScore)}–${Math.min(m.teamScore, m.opponentScore)}`;
}

function miniRow(m) {
    const text = `
        <span class="mini-dot" aria-hidden="true"></span>
        <span><span class="mini-title">${escapeHtml(m.title)}</span><span class="mini-sub">${escapeHtml([fmtDate(m.date), scoreLine(m)].filter(Boolean).join(' · '))}</span></span>`;
    return m.summary
        ? `<button type="button" class="mini" data-meet-stats="${escapeHtml(m.id)}">${text}<span class="sr-only">, see team stats</span>${icon('chevron')}</button>`
        : `<div class="mini">${text}</div>`;
}

/* ---------------- Swimmer dropdown ---------------- */
async function loadSwimmers() {
    const select = document.getElementById('swimmerSelect');
    try {
        const res = await fetch('/api/swimmerStats');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { swimmers } = await res.json();
        select.innerHTML = swimmers.length
            ? '<option value="">Choose a swimmer…</option>' + swimmers.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')
            : '<option value="">No swimmers on record yet</option>';
    } catch (e) {
        select.innerHTML = '<option value="">Couldn\'t load swimmers</option>';
    }
}

function statsUrl(name) {
    return name ? `/stats.html?swimmer=${encodeURIComponent(name)}` : '/stats.html';
}

// Picking a swimmer opens their Stats page. On Windows, arrow keys change a
// closed dropdown as they go, so a keyboard pick waits for Enter instead of
// leaving the page on the first key press. "Full stats" follows the pick either way.
(function () {
    const select = document.getElementById('swimmerSelect');
    let pickedWithPointer = false;
    select.addEventListener('pointerdown', () => { pickedWithPointer = true; });
    select.addEventListener('keydown', (event) => {
        pickedWithPointer = false;
        // After the key's own work, which may have just chosen a name.
        if (event.key === 'Enter') setTimeout(() => { if (select.value) location.href = statsUrl(select.value); }, 0);
    });
    select.addEventListener('change', () => {
        document.getElementById('fullStatsLink').href = statsUrl(select.value);
        if (pickedWithPointer && select.value) location.href = statsUrl(select.value);
    });
    // Back from a swimmer's page, the browser can show this page as it was left;
    // start over so picking that same swimmer again still works.
    window.addEventListener('pageshow', (event) => {
        if (!event.persisted) return;
        select.value = '';
        document.getElementById('fullStatsLink').href = statsUrl('');
    });
})();

/* ---------------- Photo card ---------------- */
// A slideshow of the newest photos. It pauses while the pointer is over it,
// stops when keyboard focus reaches it, and has its own pause button.
const SLIDESHOW_MAX = 10;
const SLIDESHOW_INTERVAL_MS = 4500;
const slideshow = { photos: [], shown: 0, timer: null, paused: false, hovering: false };

async function loadPhotos() {
    const box = document.getElementById('galleryContent');
    let photos;
    try {
        const res = await fetch('/api/galleryPublic');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        photos = await res.json();
    } catch (e) {
        box.innerHTML = '<p class="empty">Couldn\'t load the photos right now.</p>';
        return;
    }
    if (!photos.length) {
        box.innerHTML = '<p class="empty">No photos yet. Be the first to share one!</p>';
        return;
    }
    slideshow.photos = photos.slice(0, SLIDESHOW_MAX);
    slideshow.shown = 0;
    const rotates = slideshow.photos.length > 1 && !matchMedia('(prefers-reduced-motion: reduce)').matches;
    const first = slideshow.photos[0];
    box.innerHTML = `
        <div class="photo-frame">
            <button type="button" class="photo-open" aria-label="View this photo full size"><img id="slideshowImg" src="${escapeHtml(first.url)}" alt="${escapeHtml(first.caption || 'Team photo')}"></button>
            ${rotates ? `<button type="button" class="photo-pause" aria-label="Pause slideshow">${icon('pause')}</button>` : ''}
        </div>`;
    box.querySelector('.photo-open').addEventListener('click', (event) => openPhotoViewer(slideshow.photos[slideshow.shown], event.currentTarget));
    if (rotates) startSlideshow(box.querySelector('.photo-frame'));
}

function startSlideshow(frame) {
    const pauseButton = frame.querySelector('.photo-pause');
    function setPaused(paused) {
        slideshow.paused = paused;
        pauseButton.setAttribute('aria-label', paused ? 'Play slideshow' : 'Pause slideshow');
        pauseButton.innerHTML = icon(paused ? 'play' : 'pause');
        syncSlideshow();
    }
    pauseButton.addEventListener('click', () => setPaused(!slideshow.paused));
    frame.addEventListener('mouseenter', () => { slideshow.hovering = true; syncSlideshow(); });
    frame.addEventListener('mouseleave', () => { slideshow.hovering = false; syncSlideshow(); });
    frame.addEventListener('focusin', (event) => {
        if (!slideshow.paused && event.target.matches(':focus-visible')) setPaused(true);
    });
    syncSlideshow();
}

function syncSlideshow() {
    const run = !slideshow.paused && !slideshow.hovering;
    if (run && !slideshow.timer) slideshow.timer = setInterval(showNextPhoto, SLIDESHOW_INTERVAL_MS);
    if (!run && slideshow.timer) {
        clearInterval(slideshow.timer);
        slideshow.timer = null;
    }
}

// Fade out, swap once the next photo has loaded, fade back in.
function showNextPhoto() {
    const img = document.getElementById('slideshowImg');
    const index = (slideshow.shown + 1) % slideshow.photos.length;
    const photo = slideshow.photos[index];
    const next = new Image();
    next.src = photo.url;
    img.style.opacity = '0';
    Promise.all([next.decode().catch(() => {}), new Promise(resolve => setTimeout(resolve, 500))]).then(() => {
        img.src = photo.url;
        img.alt = photo.caption || 'Team photo';
        img.style.opacity = '1';
        slideshow.shown = index;
    });
}

// The slideshow crops each photo to fill the card; the viewer shows all of it.
function openPhotoViewer(photo, opener) {
    const img = document.getElementById('photoViewerImg');
    img.src = photo.url;
    img.alt = photo.caption || 'Team photo';
    document.getElementById('photoViewerCaption').textContent = [photo.caption, photo.submittedBy && `— ${photo.submittedBy}`].filter(Boolean).join(' ');
    const download = document.getElementById('photoViewerDownload');
    download.hidden = !photo.downloadUrl;
    if (photo.downloadUrl) download.href = photo.downloadUrl;
    else download.removeAttribute('href');
    SiteUI.openDialog(document.getElementById('photoViewer'), opener);
}
// The viewer fills the screen, so there's no backdrop to tap; tapping the dark area around the photo closes it instead.
document.getElementById('photoViewer').addEventListener('click', (event) => {
    if (event.target === event.currentTarget || event.target.classList.contains('photo-viewer-stage')) event.currentTarget.close();
});

loadMeets();
loadSwimmers();
loadPhotos();
</script>
