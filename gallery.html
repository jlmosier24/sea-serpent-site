<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos | Spotswood Sea Serpents</title>
<meta name="description" content="Team photos for the Spotswood Sea Serpents summer swim team. Share your own -- it goes live after a quick coach review.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M4 30c4-6 8-6 12 0s8 6 12 0 8-6 12 0 8 6 12 0' stroke='%232F8F3E' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/site.js"></script>
<script src="/assets/meets.js"></script>
<script src="/assets/photos.js"></script>
<style>
    /* Gallery page only. Cards, chips, the drop zone, dialogs, and the photo viewer come from /assets/site.css. */
    main.wrap { padding-bottom: 80px; }
    .gallery-title { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; padding-bottom: 24px; }
    .gallery-title p { max-width: 620px; }
    .gallery-title .btn { padding: 12px 22px; font-size: 16px; }
    .photo-count { color: var(--muted); font-size: 15px; font-weight: 500; white-space: nowrap; }
    .gallery-card .chip-row { margin-bottom: 20px; }
    .filter-note { margin: -6px 0 16px; color: var(--muted); font-size: 15px; }
    .loading, .empty { margin: 0; padding: 40px 10px; color: var(--muted); text-align: center; }

    /* The photos themselves are rows of whole photos (Photos.showRows, /assets/photos.js). */


</style>
</head>
<body>
<site-header current="gallery"></site-header>
<main class="wrap">
    <div class="page-title gallery-title">
        <div>
            <h1>Team Photos</h1>
            <p>Photos from meets and practices. Anyone can add one. Photos are reviewed before they go live.</p>
        </div>
        <button type="button" class="btn primary" id="uploadButton"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>Upload photos</button>
    </div>

    <section class="card gallery-card" aria-labelledby="galleryHeading">
        <div class="card-head"><h2 id="galleryHeading">All photos</h2><span class="photo-count" id="photoCount" role="status"></span></div>
        <div class="chip-row" id="photoFilters" role="group" aria-label="Show photos from"></div>
        <p class="filter-note" id="filterNote" hidden>No photos from that meet yet, so here are all of them.</p>
        <div class="photo-grid" id="photoGrid"><p class="loading">Loading photos…</p></div>
    </section>
</main>
<script src="/assets/upload.js"></script>
<script>
const { escapeHtml, plural } = Meets;

/* ---------------- The gallery ---------------- */
let photos = [];
let filter = 'all';
const filtersBox = document.getElementById('photoFilters');
const grid = document.getElementById('photoGrid');

// All, then each meet that has photos (newest first), then Practice & other.
// Photos with no date are only under All.
function filterOptions() {
    const meets = new Map();
    let other = 0;
    for (const photo of photos) {
        if (!photo.tag) continue;
        if (photo.tag.key === 'other') {
            other++;
            continue;
        }
        const option = meets.get(photo.tag.key) || { key: photo.tag.key, label: photo.tag.label, date: photo.tag.meetDate, count: 0 };
        option.count++;
        meets.set(photo.tag.key, option);
    }
    return [
        { key: 'all', label: 'All', heading: 'Recent', count: photos.length },
        ...[...meets.values()].sort((a, b) => b.date.localeCompare(a.date)),
        ...(other ? [{ key: 'other', label: 'Practice & other', count: other }] : [])
    ];
}

function shownPhotos() {
    return filter === 'all' ? photos : photos.filter(p => p.tag && p.tag.key === filter);
}

function renderFilters() {
    const options = filterOptions();
    // With nothing to choose between, there's no point showing a lone "All".
    filtersBox.innerHTML = options.length > 1
        ? options.map(o => `<button type="button" class="chip" data-filter="${escapeHtml(o.key)}" aria-pressed="${o.key === filter}">${escapeHtml(o.label)}<span class="chip-count">${o.count}<span class="sr-only"> ${o.count === 1 ? 'photo' : 'photos'}</span></span></button>`).join('')
        : '';
    filtersBox.hidden = options.length < 2;
}

function renderGrid() {
    const option = filterOptions().find(o => o.key === filter);
    document.getElementById('galleryHeading').textContent = option.heading || option.label;
    const list = shownPhotos();
    document.getElementById('photoCount').textContent = plural(list.length, 'photo', 'photos');
    // Rows of whole photos, shorter on phones so a row still fits two or three.
    Photos.showRows(grid, list, { targetHeight: width => (width < 500 ? 170 : 210), labelFor: photo => (photo.tag ? photo.tag.label : '') });
    if (!list.length) grid.innerHTML = `<p class="empty">${photos.length ? 'No photos here yet.' : 'No photos yet. Be the first to share one!'}</p>`;
}

filtersBox.addEventListener('click', (event) => {
    const chip = event.target.closest('[data-filter]');
    if (!chip) return;
    filter = chip.dataset.filter;
    filtersBox.querySelectorAll('[data-filter]').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
    document.getElementById('filterNote').hidden = true;
    // The address follows the filter, so a meet's photos can be linked to or bookmarked.
    history.replaceState(null, '', filter === 'all' ? location.pathname : `?meet=${encodeURIComponent(filter)}`);
    renderGrid();
});

grid.addEventListener('click', (event) => {
    const tile = event.target.closest('.photo-tile');
    if (tile) Photos.open(shownPhotos(), Number(tile.dataset.index), tile);
});

async function loadPhotos() {
    try {
        const res = await fetch('/api/galleryPublic');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        photos = await res.json();
        // A link for one meet (like the home page's "View photos") opens on that meet's photos.
        const wanted = new URLSearchParams(location.search).get('meet');
        const found = !!wanted && filterOptions().some(o => o.key === wanted);
        if (found) filter = wanted;
        document.getElementById('filterNote').hidden = !wanted || found;
        renderFilters();
        renderGrid();
    } catch (e) {
        grid.innerHTML = '<p class="empty">Couldn\'t load the photos right now.</p>';
    }
}

/* ---------------- Sharing ---------------- */
// The "Share photos" dialog is shared with the home page (/assets/upload.js).
document.getElementById('uploadButton').addEventListener('click', (event) => PhotoUpload.open(event.currentTarget));

loadPhotos();
</script>
</body>
</html>
